[package]
name = "airmail"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
levenshtein_automata = "0.2.1"
s2 = "0.2.0"
# Default features include "mmap", which doesn't build for wasm32; re-added for native targets below.
tantivy = { version = "0.22.0", default-features = false, features = [
    "stopwords",
    "lz4-compression",
] }
tantivy-common = "0.7.0"
tantivy-fst = "0.4.0"
tempfile = "3.9.0"
log = "0.4.20"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
lru = "0.12.2"
async-trait = "0.1.77"
# "full" needs OS threads and sockets, which wasm32 lacks; re-added for native targets below.
tokio = { version = "1.36.0", default-features = false, features = ["macros"] }
futures-util = "0.3.30"
deunicode = "1.4.3"
itertools = "0.12.1"
unicode-segmentation = "1.11.0"
lazy_static = "1.4.0"
regex = "1.10.3"
geo = "0.27.0"
anyhow = "1.0.86"
thiserror = "1.0.63"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tantivy = { version = "0.22.0", default-features = false, features = ["mmap", "zstd-compression"] }
tokio = { version = "1.36.0", features = ["full"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Transitive dependency; "js" supplies an RNG source on wasm32.
getrandom = { version = "0.2", features = ["js"] }

# Remote (HTTP) indexes rely on Linux's userfaultfd.
[target.'cfg(target_os = "linux")'.dependencies]
reqwest = { version = "0.11.24", features = ["blocking"] }
nix = { version = "0.27", features = ["ioctl", "mman"] }
userfaultfd = { version = "0.8.1", features = ["linux4_14", "linux5_7"] }
tantivy-uffd = "0.1.1"

[features]
remote_index = ["tantivy/quickwit"]
invasive_logging = []
