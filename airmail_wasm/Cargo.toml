[package]
name = "airmail_wasm"
version = "0.1.0"
edition = "2021"
publish = false

# This crate is a feasibility POC, not a real product surface yet. It
# exposes: (a) `smoke_test`, exercising schema/query/search/result-building
# end to end against an in-memory index, used to measure realistic .wasm
# binary size; and (b) `open_index`/`search_index`, which open a real,
# pre-built index directory through `StorageDirectory` (see
# storage_directory.rs), a read-only tantivy `Directory` backed by JS-
# provided sync byte storage -- OPFS in a real browser Worker, or (for this
# POC) synchronous `fs` reads in a Node.js test harness (test/node_test.cjs).
#
# "quickwit" here matches airmail_indexer's default `remote_index` feature
# (`airmail/remote_index` -> `tantivy/quickwit`), which switches tantivy's
# on-disk term dictionary from FST to SSTable. Since airmail_indexer builds
# indexes with that feature on by default, a wasm reader needs it too to
# open indexes built by an unmodified `indexer` invocation -- without it,
# opening a real index fails with "Unsuported dictionary type, expected 1,
# found 2" (FST reader, SSTable file).
#
# "zstd-compression" matches airmail's `AirmailIndex::create()`, which now
# builds indexes with a zstd-19 doc store (see index.rs) instead of
# tantivy's lz4 default -- ~14% smaller gzip'd index, measured on NYC.
# Without this feature here, opening such an index fails identically to the
# quickwit case above: Index::open() errors deserializing meta.json,
# "unsupported variant `zstd`, please enable Tantivy's `zstd-compression`
# feature". Verified this compiles and links for wasm32-unknown-unknown
# (zstd-sys's C source needs a wasm-capable C compiler -- CC_wasm32_unknown_unknown
# must point at one, e.g. Homebrew LLVM's clang) and adds ~0.05% to the
# final gzip'd .wasm size: only the decompression path is ever reachable
# here, since create() -- the only caller of the zstd *compressor* -- is
# `#[cfg(not(target_arch = "wasm32"))]` and isn't part of this build at all.
# Confirmed via node_test.cjs: opens and searches both zstd- and
# lz4-compressed indexes correctly (this feature is additive, not a format
# switch -- lz4 indexes keep working).

[lib]
crate-type = ["cdylib"]

[dependencies]
airmail = { path = "../airmail", default-features = false }
tantivy = { version = "0.22.0", default-features = false, features = [
    "stopwords",
    "lz4-compression",
    "quickwit",
    "zstd-compression",
] }
tantivy-common = "0.7.0"
serde_json = "1"
wasm-bindgen = "0.2.92"
wasm-bindgen-futures = "0.4.42"
