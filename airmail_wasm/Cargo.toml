[package]
name = "airmail_wasm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
airmail = { path = "../airmail", default-features = false }
# Required to read indexer output: "quickwit" for its SSTable term dictionary
# (the indexer's default `remote_index`), "zstd-compression" for its doc store.
tantivy = { version = "0.22.0", default-features = false, features = [
    "stopwords",
    "lz4-compression",
    "quickwit",
    "zstd-compression",
] }
tantivy-common = "0.7.0"
serde_json = "1"
wasm-bindgen = "0.2.92"
wasm-bindgen-futures = "0.4.42"
